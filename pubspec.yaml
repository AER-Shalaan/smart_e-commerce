name: smart_ecommerce
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.5

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking
  dio: ^5.9.0
  dartz: ^0.10.1
  jwt_decoder: ^2.0.1

  # UI & Animation
  animate_do: ^5.1.0
  carousel_slider: ^5.1.1
  dots_indicator: ^4.0.1
  flutter_onboarding_slider: ^1.0.11
  loading_animation_widget: ^1.3.0
  shimmer: ^3.0.0
  timelines_plus: ^2.0.0
  widget_and_text_animator: ^1.1.5

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # SVG & Fonts
  flutter_svg: ^2.2.0
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0

  # Input
  pinput: ^6.0.2

  # Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

  # Components
  awesome_snackbar_content: ^0.1.6
  persistent_bottom_nav_bar_v2: ^6.1.0

  # WebView
  webview_flutter: ^4.13.0

  # Development Tools
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: GeneralSans
      fonts:
        - asset: fonts/GeneralSans-Regular.otf
          weight: 400

        - asset: fonts/GeneralSans-Medium.otf
          weight: 500

        - asset: fonts/GeneralSans-Semibold.otf
          weight: 600

        - asset: fonts/GeneralSans-Bold.otf
          weight: 700

flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: assets.dart